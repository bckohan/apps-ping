name: APPS Ping

# Each run checks, for every processor in APPS_PING_PROCESSORS, that the
# previous ping submission processed, then uploads a new one and approves it
# (see src/apps_ping/ping.py). Problems are pushed to
# ntfy.sh. Schedules run only from the default branch, are in UTC and may be
# delayed by GitHub under load. Every run appends a line per processor to
# ping.log, re-renders the uptime images in uptime/ and commits them, which also keeps GitHub from disabling the schedule after 60
# days of repository inactivity.
#
# The primary trigger is the Cloudflare Worker in dispatcher/, which starts
# this workflow through workflow_dispatch at 7 past every hour. GitHub's own
# schedule below is only a backup: it skips if a run already pinged recently.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

# Needed to commit ping.log back to main.
permissions:
  contents: write

# Never run two pings at once, but don't cancel one mid-upload either.
concurrency:
  group: apps-ping
  cancel-in-progress: false

env:
  NTFY_TOPIC: ${{ vars.NTFY_TOPIC || 'apps-ping-usn8' }}
  # Comma separated processor labels to ping. Override with a repository
  # variable of the same name.
  APPS_PING_PROCESSORS: ${{ vars.APPS_PING_PROCESSORS || 'apps01ca' }}
  PYTHONUNBUFFERED: "1"

jobs:
  # Scheduled (backup) runs stand down if the last ping was under 40 minutes ago.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ping.log
          sparse-checkout-cone-mode: false

      - name: Check for a recent ping
        id: check
        run: |
          run=true
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ -s ping.log ]; then
            last=$(tail -n1 ping.log | cut -d' ' -f1)
            # an unparseable line counts as old, so the ping still runs
            last_s=$(date -u -d "$last" +%s 2>/dev/null) || last_s=0
            age=$(( $(date -u +%s) - last_s ))
            if [ "$age" -lt 2400 ]; then
              echo "Last ping was $((age / 60)) minutes ago; skipping." >> "$GITHUB_STEP_SUMMARY"
              run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  ping:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --no-dev --locked

      - name: Write APPS credential
        env:
          APPS_SETTINGS: ${{ secrets.APPS_SETTINGS }}
        run: |
          umask 077
          printf '%s' "$APPS_SETTINGS" > "$RUNNER_TEMP/apps_settings"

      - name: Ping APPS
        id: ping
        env:
          APPS_SETTINGS_FILE: ${{ runner.temp }}/apps_settings
        run: uv run --no-sync apps-ping data/usn83250.26o.gz --log ping.log

      # These run whether the ping passed or failed, as long as it wrote a line.
      - name: Render uptime images
        if: always() && hashFiles('ping.log') != ''
        run: uv run --no-sync apps-ping-uptime ping.log uptime

      - name: Commit ping log
        if: always() && hashFiles('ping.log') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ping.log uptime
          git diff --cached --quiet && exit 0
          git commit -q -m "ping: $(tail -n1 ping.log | cut -c1-72)"
          for attempt in 1 2 3; do
            git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 5
          done
          exit 1

      # Catches failures the ping script could not report itself (setup
      # failures, a missing secret, etc).
      - name: Notify on workflow failure
        if: failure() && steps.ping.outputs.notified != 'true'
        run: |
          curl -fsS \
            -H "Title: APPS ping workflow failed" \
            -H "Tags: satellite,warning" \
            -H "Priority: high" \
            -H "Click: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "The apps-ping GitHub workflow failed before it could report a result." \
            "https://ntfy.sh/$NTFY_TOPIC"
